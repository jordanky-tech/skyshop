services:
  backend:
    build: 
      context: ./backend
    ports:
      - "7777:7777"
    depends_on:
      - postgres
    container_name: skyshop_api
    networks:
      - skyshop_net
      

  postgres:
    image: postgres:17
    container_name: shop-postgres
    environment:
      POSTGRES_DB: skyshop
      POSTGRES_USER: skyshop
      POSTGRES_PASSWORD: skyshop
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - skyshop_net

  frontend:
    build: 
      context: ./frontend
    ports:
      - "4200:80"
    depends_on:
      - backend

volumes:
  postgres_data:

networks:
  skyshop_net:
    driver: bridge
