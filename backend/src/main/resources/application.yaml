spring:
  application:
    name: shoplink

  datasource:
    url: jdbc:postgresql://localhost:5432/skyshop
    username: skyshop
    password: skyshop
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect